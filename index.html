<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="_public/Styles/App.css" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        border-sizing: border-box;
      }

      html,
      body {
        font-family: sans-serif;
        font-size: 1rem;
      }

      .container {
        max-width: 1235px;
        margin-inline: auto;
      }

      header.main-header {
        background-color: whitesmoke;
        box-shadow: 1px 5px 20px rgba(0 0 0 / 0.1);
        border-block-end: 1px solid white;
      }

      header.main-header .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 800px;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 1rem;
      }
      nav ul a {
        text-decoration: none;
        color: #555;
        transition: all 0.5s;
        font-weight: 600;
        position: relative;
        display: block;
        padding: 1rem;
      }
      nav ul a::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        right: 50%;
        transform: translateX(-50%);
        height: 2px;
        background-color: #555;
        transition: all 0.3s;
      }
      nav ul a:hover {
        color: orangered;
      }
      nav ul a:hover::before,
      nav ul a.current::before {
        right: 0;
      }
      h1 {
        font-size: 2rem;
        text-transform: uppercase;
        color: orangered;
      }
      .product-listing-container {
        display: flex;
        flex-flow: row wrap;
        justify-content: space-center;
        gap: 1rem;
      }
      .product-card--listing {
        max-width: 450px;
        background: whitesmoke;
        padding: 1rem;
        border-radius: 10px;
      }
      .product-card--listing img {
        margin-inline: auto;
        display: block;
      }
      .product-card--listing .product-card_title {
        font-size: 1.24rem;
        margin: 1rem;
        maring-inline: auto;
        background-color: white;
        text-align: center;
        color: #455;
        padding: 1rem 1rem;
        border-radius: 10px;
      }

      .product-card--listing_details-list {
        list-style: none;
        margin: 1rem 0;
        width: 100%;
      }
      .product-card--listing_details-list_price {
        font-size: 1.24rem;
        font-weight: 900;
        text-align: right;
        color: #97c209ff;
        background-color: white;
        width: fit-content;
        padding: 10px;
        border-radius: 10px;
        margin-inline-start: auto;
        transform: translatex(2rem);
        box-shadow: 5px 5px 10px #00000020;
      }

      .product-card--listing_details-list li {
        margin-block: 1rem;
      }
      .product-card--listing_main .description {
        max-width: 80%;
        margin-inline-start: auto;
      }
      .product-card--listing_footer form {
        margin-block: 1rem;
        margin-inline: auto;
        border: 1px solid white;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .product-card--listing_footer button {
        border: unset;
        color: white;
        background: orangered;
        padding: 1rem;
        border-radius: 5px;
        text-transform: uppercase;
        font-size: 1.24rem;
        cursor: pointer;
      }
      .product-card--listing_footer a {
        text-decoration: none;
        color: orangered;
        text-transform: uppercase;
        font-size: smaller;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <h1>Shop</h1>
        <nav>
          <ul>
            <li><a class="current" href="">Home</a></li>
            <li><a href="">Shop</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <h2>Products</h2>
        <div class="product-listing-container">
          <!--JS-->
        </div>
      </div>
    </main>
    <footer>footer</footer>
    <script>
      const productCardTemplate = (item) => {
        return ` <article class="product-card--listing">
          <header>
            <img
              class="product-card_media"
              src="${item.thumbnail}"
              alt="${item.title}"
            />
            <h3 class="product-card_title">${item.title}</h3>
          </header>
          <main class="product-card--listing_main">
            <ul class="product-card--listing_details-list">
              <li class="product-card--listing_details-list_price">
                Price: <span class="priceReal">${item.price} $</span>
              </li>
            </ul>
            <p class="description">
              ${item.description}
            </p>
          </main>
          <footer class="product-card--listing_footer">
            <form class="product-card--listing_form">
              <label>
                Units:
                <input type="number" min="1" max="5" value="1" />
              </label>

              <div class="product-card--listing_form_links">
                <button
                  type="submit"
                  class="product-card--listing_footer_submit"
                >
                  Buy
                </button>
                <a href="#" class="product-card--listing_footer_details"
                  >Details</a
                >
              </div>
            </form>
          </footer>
        </article>`;
      };

      const fetchProductsListing = async () => {
        const data = await fetch("https://dummyjson.com/products");
        const response = await data.json();
        const list = response;
        const productListingContainer = document.querySelector(
          ".product-listing-container"
        );

        productListingContainer.innerHTML = "";

        productListingContainer.innerHTML = list.products
          .map(productCardTemplate)
          .join("");
      };

      fetchProductsListing();
    </script>
  </body>
</html>
